[workspace]
resolver = "2"
members = [
    "crates/shm-core",
    "crates/shm-arrow",
    "crates/shm-ring",
    "crates/shm-task",
    "crates/shm-artifact",
    "crates/shm-stream",
    "crates/shm-store",
    "crates/shm-runtime",
    "crates/shm-bench",
    "crates/shm-arrowref-spike",
]
# The cargo-fuzz harnesses (v0.4 stage N) are a separate nightly-only crate with
# their own detached workspace; keep them out of the pinned-stable workspace so
# `cargo build/test --workspace` never touches them.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/example/shm-actors"

[workspace.dependencies]
# Intra-workspace
# Publishable coordinates for the crates that leave this workspace.
#
# `path` still wins for every local build — these extra keys only take effect
# when the crate is *published*, where a bare path dependency is rejected
# ("all dependencies must have a version specified"). Marking the registry is
# also mandatory: a crate published to an alternative registry may only depend
# on crates from that same registry.
#
# Only the crates ArrowRef actually consumes carry these; the rest of the
# workspace stays path-only because nothing outside this repo references them.
shm-core = { path = "crates/shm-core", version = "0.1.0", registry = "kellnr" }
shm-arrow = { path = "crates/shm-arrow" }
shm-ring = { path = "crates/shm-ring" }
shm-task = { path = "crates/shm-task" }
shm-artifact = { path = "crates/shm-artifact" }
shm-stream = { path = "crates/shm-stream" }
shm-store = { path = "crates/shm-store" }
shm-runtime = { path = "crates/shm-runtime" }

# External
bytemuck = { version = "1", features = ["derive"] }
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["socket", "uio", "mman", "fs", "signal", "process", "poll"] }
thiserror = "2"
arrow = { version = "58", default-features = false, features = ["ipc"] }
arrow-schema = "58"
arrow-buffer = "58"
arrow-array = "58"
arrow-data = "58"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
